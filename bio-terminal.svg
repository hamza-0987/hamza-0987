<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d9ff"/>
      <stop offset="1" stop-color="#7b2ff7"/>
    </linearGradient>
  </defs>

  <!-- window -->
  <rect x="20" y="20" width="680" height="380" rx="14" fill="url(#bar)"/>
  <rect x="23" y="23" width="674" height="374" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/>

  <!-- title bar -->
  <circle cx="42" cy="42" r="6" fill="#ff5f56"/>
  <circle cx="62" cy="42" r="6" fill="#ffbd2e"/>
  <circle cx="82" cy="42" r="6" fill="#27c93f"/>
  <text x="360" y="47" text-anchor="middle" font-family="monospace" font-size="13" fill="#8b949e">hamza@mlops: ~</text>

  <!-- prompt lines -->
  <text x="40" y="100" font-family="monospace" font-size="16" fill="#00d9ff">hamza@mlops:~$ whoami</text>
  <text x="40" y="128" font-family="monospace" font-size="16" fill="#e6edf3">AI &amp; MLOps Engineer</text>
  <text x="40" y="152" font-family="monospace" font-size="14" fill="#8b949e">Cloud Infrastructure · Computer Vision · LLM Agents</text>

  <text x="40" y="190" font-family="monospace" font-size="16" fill="#00d9ff">hamza@mlops:~$ cat stack.yaml</text>
  <text x="40" y="218" font-family="monospace" font-size="14" fill="#7ee787">lang:</text>
  <text x="140" y="218" font-family="monospace" font-size="14" fill="#e6edf3">Python, JS/TS, SQL</text>
  <text x="40" y="240" font-family="monospace" font-size="14" fill="#7ee787">cloud:</text>
  <text x="140" y="240" font-family="monospace" font-size="14" fill="#e6edf3">AWS, Azure, GCP</text>
  <text x="40" y="262" font-family="monospace" font-size="14" fill="#7ee787">ml:</text>
  <text x="140" y="262" font-family="monospace" font-size="14" fill="#e6edf3">PyTorch, TensorFlow, OpenCV</text>
  <text x="40" y="284" font-family="monospace" font-size="14" fill="#7ee787">ai:</text>
  <text x="140" y="284" font-family="monospace" font-size="14" fill="#e6edf3">RAG, Multi-LLM Agents, MCP</text>
  <text x="40" y="306" font-family="monospace" font-size="14" fill="#7ee787">cv:</text>
  <text x="140" y="306" font-family="monospace" font-size="14" fill="#e6edf3">SAM2, YOLO, DINO, Segmentation</text>

  <text x="40" y="346" font-family="monospace" font-size="16" fill="#00d9ff">hamza@mlops:~$ status --ship</text>
  <text x="40" y="374" font-family="monospace" font-size="16" fill="#27c93f">TERMINAL_READY › systems that ship 📦</text>
  <rect x="598" y="362" width="70" height="10" rx="5" fill="#0d1117" stroke="#30363d"/>
  <rect x="598" y="362" width="62" height="10" rx="5" fill="url(#bar)"/>
</svg>