<svg xmlns="http://www.w3.org/2000/svg" width="720" height="190" viewBox="0 0 720 190">
  <defs>
    <linearGradient id="wbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161b22"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="wpulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d9ff"/>
      <stop offset="1" stop-color="#7b2ff7"/>
    </linearGradient>
    <style>
      @keyframes blink { 0%,49% {opacity:1} 50%,100% {opacity:0} }
      @keyframes glow { 0%,100% {opacity:0.3} 50% {opacity:1} }
      .cursor { animation: blink 1.2s step-end infinite; }
      .dot { animation: glow 1.6s ease-in-out infinite; }
    </style>
  </defs>

  <rect x="20" y="20" width="680" height="150" rx="14" fill="url(#wbg)" stroke="#30363d" stroke-width="1"/>

  <!-- status dots -->
  <circle class="dot" cx="46" cy="42" r="5" fill="#27c93f"/>
  <circle class="dot" cx="64" cy="42" r="5" fill="#7b2ff7" style="animation-delay:0.4s"/>
  <circle class="dot" cx="82" cy="42" r="5" fill="#00d9ff" style="animation-delay:0.8s"/>

  <text x="110" y="46" font-family="monospace" font-size="12" fill="#8b949e">$ status --working-on</text>

  <text x="44" y="92" font-family="monospace" font-size="15" fill="#00d9ff">⚡ Building:</text>
  <text x="170" y="92" font-family="monospace" font-size="15" fill="#e6edf3">RAG engines · multi-agent AI · MCP tooling</text>

  <text x="44" y="126" font-family="monospace" font-size="15" fill="#7b2ff7">🎯 Learning:</text>
  <text x="170" y="126" font-family="monospace" font-size="15" fill="#e6edf3">Agentic AI · LLM orchestration · distributed systems</text>

  <text x="648" y="126" font-family="monospace" font-size="18" fill="#00d9ff" class="cursor">▊</text>
</svg>